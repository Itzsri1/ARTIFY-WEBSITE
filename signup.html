<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Artify | Sign Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Allura&display=swap"
    rel="stylesheet"
>
    

    <link rel="stylesheet" href="style.css">

</head>

<body class="login-page signup-page">

    <div class="login-container">

        <!-- Logo -->

        <div class="login-logo">
    <span class="logo-hat"></span>
    <span class="logo-text">ARTIFY<span>.</span></span>
</div>

        <!-- Sign Up Card -->

        <div class="login-card">

            <p class="login-small-heading">
                JOIN ARTIFY
            </p>

            <h1>
                Create an Account
            </h1>

            <p class="login-description">
                Create your account and start exploring
                beautiful handmade creations.
            </p>


            <form id="signupForm">

                <!-- Full Name -->

                <div class="input-group">

                    <label for="signupName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="signupName"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <!-- Email -->

                <div class="input-group">

                    <label for="signupEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="signupEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="input-group">

                    <label for="signupPassword">
                        Password
                    </label>

                    <div class="password-box">

    <input
        type="password"
        id="signupPassword"
        placeholder="Create a password"
        required
    >

    <button
        type="button"
        id="showSignupPassword"
    >
        👁
    </button>

</div>


                <!-- Confirm Password -->

                <div class="input-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <!-- Create Account -->

                <button
                    type="submit"
                    class="login-button"
                >
                    Create Account
                </button>


                <!-- Message -->

                <p
                    id="signupMessage"
                    class="login-message"
                ></p>

            </form>


            <!-- Login Link -->

            <div class="signup-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </div>

        </div>


        <!-- Back Home -->

        <a
            href="index.html"
            class="back-home"
        >
            ← Back to Artify
        </a>

    </div>


    <script src="script.js"></script>

</body>

</html>
