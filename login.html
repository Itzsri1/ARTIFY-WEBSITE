<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Artify | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Allura&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

   

</head>


<body class="login-page">

    <div class="login-container">

        <!-- Logo -->

       <div class="login-logo">
    <span class="logo-hat"></span>
    <span class="logo-text">ARTIFY<span>.</span></span>
</div>

        <!-- Login Card -->

        <div class="login-card">

            <p class="login-small-heading">
                WELCOME BACK
            </p>

            <h1>
                Sign in to Artify
            </h1>

            <p class="login-description">
                Enter your details to continue exploring
                beautiful handmade creations.
            </p>


            <!-- Login Form -->

            <form id="loginForm">

                <div class="input-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            id="showPassword"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <div class="login-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        Remember me

                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <button
                    type="submit"
                    class="login-button"
                >
                    Login
                </button>


                <p
                    id="loginMessage"
                    class="login-message"
                ></p>

            </form>


            <!-- Sign Up -->

            <div class="signup-text">

    Don't have an account?

    <a href="signup.html">
        Create an Account
    </a>

</div>

            </div>

        </div>


        <!-- Back to website -->

        <a
            href="index.html"
            class="back-home"
        >
            ← Back to Artify
        </a>

    </div>


    <script src="script.js"></script>

</body>

</html>
